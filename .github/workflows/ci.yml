name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          # A throwaway container reachable only from this job: trust authentication, no password to keep.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: recall_test
          # The same collation as scripts/pg.sh, so text sorts the same here and on a laptop.
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recall_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      RECALL_TEST_DATABASE_URL: postgresql://postgres@localhost:5544/recall_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        # The API (FastAPI) and the live provider's SDK, so their tests run; no model and no key.
        run: pip install -e '.[dev,api,llm]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest --cov --cov-report=term-missing

  corpus:
    # Fetches the real pinned archive from GitHub, so a change on GitHub's side (or in the manifest) shows here.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e '.[dev]'
      - name: Fetch the pinned corpus
        run: recall fetch
      - name: Verify it against the manifest
        run: recall verify
      - name: Tests on the real corpus
        env:
          RECALL_REQUIRE_CORPUS: "1"
        run: pytest tests/test_real_corpus.py
      - name: Corpus sizes
        run: |
          {
            echo '### Corpus sizes (recall stats)'
            echo '```'
            recall stats
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  pg-script:
    # scripts/pg.sh on Linux: PostgreSQL 17 and pgvector from the PostgreSQL project's apt repository.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e '.[dev]'
      - name: Install PostgreSQL 17 and pgvector
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-17 postgresql-17-pgvector
      - name: Test scripts/pg.sh
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
          RECALL_REQUIRE_PG_SCRIPT: "1"
        run: pytest tests/test_pg_script.py

  model:
    # The real models (bge-small-en-v1.5 and the MiniLM cross-encoder, on the CPU) on the real corpus: ingest it,
    # search it in every mode, rerank, answer.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: recall_test
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recall_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      RECALL_TEST_DATABASE_URL: postgresql://postgres@localhost:5544/recall_test
      # Turn the model tests' skips into failures: here the model must be there.
      RECALL_REQUIRE_MODEL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU-only PyTorch; the default Linux wheel brings CUDA)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev,embed,api]'
      - name: Cache the models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          # The embedder's and the reranker's pinned revisions live in these two files.
          key: hf-${{ hashFiles('src/recall/embedding.py', 'src/recall/rerank.py') }}
      - name: Fetch the pinned corpus
        run: recall fetch
      - name: Model tests (unit, then the real corpus)
        run: pytest -m model -s
      - name: Token fit
        # shell: bash adds pipefail, so the script failing fails the step despite the pipe into tee.
        shell: bash
        run: |
          {
            echo '### Chunks counted in model tokens: the embedder, then the reranker (scripts/token_fit.py)'
            echo '```'
            python scripts/token_fit.py
            echo
            python scripts/token_fit.py --reranker --question "How do I declare a query parameter with a default value?"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retrieval evaluation (fails if worse than eval/baseline.json)
        # The real corpus ingested into the service database's public schema (the tests used schemas of their own),
        # then every system on the labelled questions, and the answers' faithfulness, against the committed baseline.
        shell: bash
        env:
          RECALL_DATABASE_URL: postgresql://postgres@localhost:5544/recall_test
        run: |
          recall ingest
          set +e
          recall eval --answers --json eval-report.json --check eval/baseline.json > eval-output.txt 2>&1
          status=$?
          set -e
          {
            echo '### Retrieval evaluation (recall eval --answers --check eval/baseline.json)'
            echo '```'
            cat eval-output.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Keep the evaluation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: eval-report.json
          if-no-files-found: ignore
