[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recall"
version = "0.1.0"
description = "Retrieval-augmented question answering over a documentation set, with citations and an evaluation harness."
readme = "README.md"
license = "MIT"
authors = [{ name = "Vivek Davara" }]
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
# The real embedding model (day 2); without it, ingest and search can use the hash embedder.
embed = ["sentence-transformers>=6.2"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff==0.17.1", "mypy>=1.10"]

[project.scripts]
recall = "recall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recall = ["py.typed", "migrations/*.sql", "corpus/manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["model: needs sentence-transformers and the embedding model (skipped without them)"]

[tool.coverage.run]
source = ["recall"]
branch = true

[tool.ruff]
line-length = 120
target-version = "py311"
# The golden files are expected output: formatting their code blocks would change the expectation.
extend-exclude = [".scratch", "tests/golden"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# Imported only inside SentenceTransformerEmbedder; the CI test job runs mypy without the embed extra.
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true
